name: Deploy portfolio to GitHub Pages

# Publica automaticamente sempre que houver push na branch principal.
on:
  push:
    branches: [main, master]
  workflow_dispatch: # permite publicar manualmente pelo botão "Run workflow"

# Permissões necessárias para o deploy no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita execuções concorrentes de deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato (pasta dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
